[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinela-result-assembler"
version = "0.4.0"
description = "Montador oficial do resultado público canônico do ARGOS: organiza fatos analíticos já calculados. Não calcula analítica."
requires-python = ">=3.10"

# Dependências ficam em requirements*.txt, seguindo o padrão dos repos `sentinela`
# e `sentinela-orchestrator`. Este arquivo configura ferramentas, não gerencia pacotes.

# O marcador PEP 561 precisa ir DENTRO do wheel. Sem ele o pacote é instalável mas
# "não-tipado" para quem o consome: o Orchestrator importaria `parse_facts`/`assemble`
# como `Any` e perderia a checagem exatamente na fronteira facts→resultado.
#
# Medido: com o `include-package-data` que o setuptools já aplica por padrão, o marcador
# viaja mesmo SEM esta declaração — ela não é o que faz funcionar hoje. Fica como intenção
# explícita, para que desligar aquele default não destipe o pacote em silêncio. Quem
# garante de fato é `tests/test_distribuicao_tipada.py`, que abre o artefato construído.
[tool.setuptools.package-data]
result_assembler = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "RUF001",  # docstrings em português usam acentuação e travessão
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["result_assembler"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["result_assembler"]
strict = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "determinism: prova que a mesma entrada produz exatamente os mesmos bytes",
    "security: prova que campo proibido não vaza para o resultado público",
]
filterwarnings = ["error::DeprecationWarning:result_assembler.*"]

[tool.coverage.run]
source = ["src/result_assembler"]
omit = ["*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
